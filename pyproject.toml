[project]
name = "flaresatformer"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flaresatformer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: needs pretrained weight downloads or long CPU time"]
addopts = "-m 'not slow'"
